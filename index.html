<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VCLIPSE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0f1220;
      --card: #171a2e;
      --text: #ffffff;
      --muted: #a9b0ff;
      --accent: #6c7bff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b1f44, var(--bg));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .container {
      background: var(--card);
      padding: 3rem 2.5rem;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 0.75rem;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .divider {
      width: 60px;
      height: 4px;
      background: var(--accent);
      margin: 0 auto 2rem;
      border-radius: 2px;
    }

    footer {
      font-size: 0.85rem;
      color: #8a90d9;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coming Soon</h1>
    <div class="divider"></div>
    <p>
      We’re working on something new.<br />
      Check back soon for updates.
    </p>
    <footer>
      © 2026
    </footer>
  </div>
</body>
</html>
